<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="t d"><title id="t">Making Housing Services Easier to Navigate</title><desc id="d">Two editable process diagrams. Recertification: notice, early documents, appointment, confirmation and updated records. Maintenance: online request, office triage, printed assignment, signed status update and digital tracking.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" stroke="#71e5ff" stroke-width="1.6" fill="none"/></marker></defs><style>text{font-family:Arial,sans-serif}.head{fill:#f4f7ff;font-size:25px;font-weight:700}.sub{fill:#b9cee6;font-size:14px}.lab{fill:#f4f7ff;font-size:16px;font-weight:700}.small{fill:#b9cee6;font-size:12px}.tile{fill:#172541;stroke:#315bff;stroke-width:2}.flow{stroke:#71e5ff;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><rect width="1200" height="690" fill="#050914"/><text class="head" x="40" y="54">MAKING HOUSING SERVICES EASIER TO NAVIGATE</text><text class="sub" x="40" y="82">Conceptual service blueprint · Volunteers of America</text><text class="lab" x="40" y="132">01 / RESIDENT RECERTIFICATION</text><rect x="40" y="164" width="185" height="76" rx="10" fill="#172541" stroke="#456088" stroke-width="2"/><text x="132.5" y="207" text-anchor="middle" fill="#f4f7ff" font-size="15">Advance notice</text><rect x="274" y="164" width="185" height="76" rx="10" fill="#172541" stroke="#456088" stroke-width="2"/><text x="366.5" y="207" text-anchor="middle" fill="#f4f7ff" font-size="15">Early documents</text><rect x="508" y="164" width="185" height="76" rx="10" fill="#315bff" stroke="#71e5ff" stroke-width="2"/><text x="600.5" y="207" text-anchor="middle" fill="#f4f7ff" font-size="15">Family appointment</text><rect x="742" y="164" width="185" height="76" rx="10" fill="#172541" stroke="#456088" stroke-width="2"/><text x="834.5" y="207" text-anchor="middle" fill="#f4f7ff" font-size="15">Confirmation</text><rect x="976" y="164" width="185" height="76" rx="10" fill="#172541" stroke="#456088" stroke-width="2"/><text x="1068.5" y="207" text-anchor="middle" fill="#f4f7ff" font-size="15">Updated records</text><path class="flow" d="M225 201 H266"/><path class="flow" d="M459 201 H500"/><path class="flow" d="M693 201 H734"/><path class="flow" d="M927 201 H968"/><text class="small" x="40" y="263">Residents: receive notice, reschedule if needed, submit documents early</text><text class="small" x="40" y="282">Office: prepare files, confirm information, complete signatures and tracking</text><line x1="40" y1="314" x2="1160" y2="314" stroke="#304158"/><text class="lab" x="40" y="357">02 / MAINTENANCE REQUESTS</text><rect x="40" y="389" width="185" height="76" rx="10" fill="#172541" stroke="#456088" stroke-width="2"/><text x="132.5" y="432" text-anchor="middle" fill="#f4f7ff" font-size="15">Online request</text><rect x="274" y="389" width="185" height="76" rx="10" fill="#172541" stroke="#456088" stroke-width="2"/><text x="366.5" y="432" text-anchor="middle" fill="#f4f7ff" font-size="15">Office triage</text><rect x="508" y="389" width="185" height="76" rx="10" fill="#172541" stroke="#456088" stroke-width="2"/><text x="600.5" y="432" text-anchor="middle" fill="#f4f7ff" font-size="15">Printed assignment</text><rect x="742" y="389" width="185" height="76" rx="10" fill="#172541" stroke="#456088" stroke-width="2"/><text x="834.5" y="432" text-anchor="middle" fill="#f4f7ff" font-size="15">Signed update</text><rect x="976" y="389" width="185" height="76" rx="10" fill="#315bff" stroke="#71e5ff" stroke-width="2"/><text x="1068.5" y="432" text-anchor="middle" fill="#f4f7ff" font-size="15">Digital tracking</text><path class="flow" d="M225 427 H266"/><path class="flow" d="M459 427 H500"/><path class="flow" d="M693 427 H734"/><path class="flow" d="M927 427 H968"/><text class="small" x="40" y="489">Resident: submit anytime · Office: prioritize next morning · Maintenance: report visit and status</text><text class="small" x="40" y="510">Office: track completion and identify recurring building-level issues</text><rect x="40" y="550" width="1120" height="95" rx="14" fill="#14223f" stroke="#315bff"/><text class="lab" x="62" y="585">2 YEARS BEHIND → 2 MONTHS AHEAD</text><text class="sub" x="62" y="610">Achieved over approximately 8 months · Appointments generally 45 minutes or less</text><text class="small" x="40" y="671">Illustrative reconstruction based on firsthand account; no unverified SLA or turnaround percentages shown.</text></svg>