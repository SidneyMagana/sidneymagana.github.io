<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" role="img" aria-labelledby="t d"><title id="t">More Capacity, Same Footprint</title><desc id="d">Illustrative side by side conceptual floor plans. The conventional layout uses fixed stations and carts. The redesigned layout repurposes carts for sorting and staged package flow in the same footprint. Not an actual Amazon floor plan.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" stroke="#71e5ff" stroke-width="1.6" fill="none"/></marker></defs><style>text{font-family:Arial,sans-serif}.head{fill:#f4f7ff;font-size:25px;font-weight:700}.sub{fill:#b9cee6;font-size:14px}.lab{fill:#f4f7ff;font-size:16px;font-weight:700}.small{fill:#b9cee6;font-size:12px}.tile{fill:#172541;stroke:#315bff;stroke-width:2}.flow{stroke:#71e5ff;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><rect width="1080" height="620" fill="#050914"/><text class="head" x="40" y="54">MORE CAPACITY. SAME FOOTPRINT.</text><text class="sub" x="40" y="82">Illustrative spatial redesign · not an actual Amazon facility plan</text><text class="lab" x="40" y="133">BEFORE · CONVENTIONAL LAYOUT</text><text class="lab" x="556" y="133">AFTER · REDESIGNED FLOW</text><rect x="40" y="150" width="475" height="345" rx="16" fill="#0d1830" stroke="#456088"/><rect x="556" y="150" width="475" height="345" rx="16" fill="#0d1830" stroke="#456088"/><rect x="66" y="180" width="125" height="55" rx="10" fill="#172541" stroke="#456088" stroke-width="2"/><text x="128.5" y="212.5" text-anchor="middle" fill="#f4f7ff" font-size="15">Shelving</text><rect x="207" y="180" width="125" height="55" rx="10" fill="#172541" stroke="#456088" stroke-width="2"/><text x="269.5" y="212.5" text-anchor="middle" fill="#f4f7ff" font-size="15">Station</text><rect x="348" y="180" width="135" height="55" rx="10" fill="#172541" stroke="#456088" stroke-width="2"/><text x="415.5" y="212.5" text-anchor="middle" fill="#f4f7ff" font-size="15">Shelving</text><rect x="66" y="355" width="125" height="55" rx="10" fill="#172541" stroke="#456088" stroke-width="2"/><text x="128.5" y="387.5" text-anchor="middle" fill="#f4f7ff" font-size="15">Carts</text><rect x="207" y="355" width="125" height="55" rx="10" fill="#172541" stroke="#456088" stroke-width="2"/><text x="269.5" y="387.5" text-anchor="middle" fill="#f4f7ff" font-size="15">Station</text><rect x="348" y="355" width="135" height="55" rx="10" fill="#172541" stroke="#456088" stroke-width="2"/><text x="415.5" y="387.5" text-anchor="middle" fill="#f4f7ff" font-size="15">Carts</text><rect x="580" y="180" width="135" height="55" rx="10" fill="#172541" stroke="#456088" stroke-width="2"/><text x="647.5" y="212.5" text-anchor="middle" fill="#f4f7ff" font-size="15">Shelving</text><rect x="732" y="180" width="135" height="55" rx="10" fill="#172541" stroke="#456088" stroke-width="2"/><text x="799.5" y="212.5" text-anchor="middle" fill="#f4f7ff" font-size="15">Station</text><rect x="884" y="180" width="120" height="55" rx="10" fill="#172541" stroke="#456088" stroke-width="2"/><text x="944" y="212.5" text-anchor="middle" fill="#f4f7ff" font-size="15">Shelving</text><rect x="580" y="350" width="135" height="55" rx="10" fill="#315bff" stroke="#71e5ff" stroke-width="2"/><text x="647.5" y="382.5" text-anchor="middle" fill="#f4f7ff" font-size="15">Sort carts</text><rect x="732" y="350" width="135" height="55" rx="10" fill="#315bff" stroke="#71e5ff" stroke-width="2"/><text x="799.5" y="382.5" text-anchor="middle" fill="#f4f7ff" font-size="15">Sort carts</text><rect x="884" y="350" width="120" height="55" rx="10" fill="#315bff" stroke="#71e5ff" stroke-width="2"/><text x="944" y="382.5" text-anchor="middle" fill="#f4f7ff" font-size="15">Staging</text><path class="flow" d="M130 255 V330 M270 255 V330 M410 255 V330"/><path class="flow" d="M648 255 V325 H800 M800 255 V325 H946 M946 255 V325"/><text class="small" x="278" y="464" text-anchor="middle">Conventional equipment placement</text><text class="small" x="794" y="464" text-anchor="middle">Repurposed carts + staged sorting</text><text class="lab" x="40" y="545">≈ 2× PACKAGE VOLUME</text><text class="sub" x="40" y="570">Same floor area and staffing · supported by internal operational reporting</text><text class="small" x="40" y="599">Conceptual reconstruction. Equipment locations and dimensions are not proprietary or to scale.</text></svg>