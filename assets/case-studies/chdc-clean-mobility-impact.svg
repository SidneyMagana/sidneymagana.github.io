<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">Driving economic mobility — scope and impact</title><desc id="d">Approximately 500 client files initiated, 200 vehicle purchases facilitated, and 100 residential EV charger cases coordinated. Retrospective estimates.</desc><rect width="1200" height="600" fill="#203747"/><text x="70" y="85" font-family="Arial,sans-serif" font-size="23" letter-spacing="4" fill="#c5d9d4">CHDC · CLEAN MOBILITY · 2019</text><text x="70" y="158" font-family="Georgia,serif" font-size="54" fill="#f5f1e8">Driving economic mobility</text><path d="M70 208H1130" stroke="#71969d"/><g font-family="Georgia,serif" font-size="92" fill="#f5f1e8"><text x="70" y="345">~500</text><text x="460" y="345">~200</text><text x="850" y="345">~100</text></g><g font-family="Arial,sans-serif" font-size="24" fill="#c5d9d4"><text x="70" y="390">Client files initiated</text><text x="460" y="390">Vehicle purchases</text><text x="460" y="420">facilitated</text><text x="850" y="390">Charger cases</text><text x="850" y="420">coordinated</text></g><path d="M70 473H1130" stroke="#71969d"/><text x="70" y="518" font-family="Arial,sans-serif" font-size="18" fill="#c5d9d4">Approximate firsthand estimates · Overlapping categories · Installation status not verified</text></svg>