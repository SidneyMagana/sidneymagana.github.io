<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="t d"><title id="t">North Richmond: CHDC reported community activity</title><desc id="d">Two cleanups; 160 tons of trash collected; 144 illegal dumping vouchers issued; more than 15 community events. Organization-wide reported activity, not solely Sidney's results.</desc><rect width="1200" height="750" fill="#f6f3eb"/><rect x="40" y="40" width="1120" height="670" rx="22" fill="#193b35"/><text x="94" y="112" fill="#b9dfcd" font-family="Arial,sans-serif" font-size="22" letter-spacing="4">NORTH RICHMOND / COMMUNITY IMPACT</text><text x="94" y="175" fill="#fffdf7" font-family="Georgia,serif" font-size="52">Collective action, visible work.</text><path d="M94 212H1106" stroke="#709b88" stroke-width="2"/><g font-family="Arial,sans-serif"><text x="96" y="331" font-size="105" fill="#d4e7a7" font-weight="700">160</text><text x="96" y="372" font-size="25" fill="#ffffff">tons of trash collected</text><text x="96" y="407" font-size="19" fill="#c6d9ce">across 2 community cleanups</text><text x="652" y="331" font-size="105" fill="#d4e7a7" font-weight="700">144</text><text x="652" y="372" font-size="25" fill="#ffffff">illegal dumping vouchers</text><text x="652" y="407" font-size="19" fill="#c6d9ce">reported as issued</text><path d="M94 447H1106" stroke="#709b88" stroke-width="2"/><text x="96" y="549" font-size="82" fill="#d4e7a7" font-weight="700">15+</text><text x="296" y="535" font-size="26" fill="#ffffff">community events</text><text x="296" y="567" font-size="19" fill="#c6d9ce">CHDC reported outreach participation</text><text x="96" y="655" font-size="17" fill="#e2e8de">Source: CHDC organizational summary · Organizational results, not individual metrics</text></g></svg>