<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
<title id="title">Merchant Quota Management — Before and After Workflow</title>
<desc id="desc">Editable reconstructed workflow showing reactive merchant quota escalation before, and proactive monitoring with automated case creation and human review and approval after.</desc>
